<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dragon Ball</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="form">
    <input type="text" id="nome" placeholder="Digite o nome de um personagem(dragonball)" required>
    <button type="submit">Buscar</button>
    <p id="erro"></p>
    <input id="genero" placeholder="Gênero" readonly>
    <input id="raca" placeholder="Raça" readonly>
    <input id="ki" placeholder="Ki" readonly>
    <input id="maxki" placeholder="Max Ki" readonly>
    <input id="afiliacao" placeholder="Afiliação" readonly>
    <img id="foto" width="150">
  </form>

  <script src="script.js"></script>
</body>
</html>
